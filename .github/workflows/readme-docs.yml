name: README Docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  readme-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify SVG-only README progress presentation
        run: python tools/update_readme_progress.py --check
